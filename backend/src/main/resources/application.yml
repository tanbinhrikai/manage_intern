spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/intern_hub_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${GCP_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        options:
          model: gemini-flash-latest
          temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            enabled: false
            initialize-schema: always

jwt:
  signerKey: ${SIGNER_KEY}
app:
  ai:
    router:
      model: gemini-2.5-pro
      temperature: 0.15
      top-p: 0.85
      max-output-tokens: 8192

    creator:
      model: gemini-2.5-flash
      temperature: 0.7
      top-p: 0.95
      max-output-tokens: 8192


