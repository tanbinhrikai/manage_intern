spring:
  application:
    name: backend
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: ${URL_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          characterEncoding: UTF-8
jwt:
  signerKey: ${SIGNER_KEY}