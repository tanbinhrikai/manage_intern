spring:
  application:
    name: backend
  datasource:
    url: ${URL_DATABASE}
    username: myuser
    password: Password@123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    locations: classpath:/db/migration,classpath:/dev/db/migration
    baseline-on-migrate: true
    baseline-version: 0
jwt:
  signerKey: ${SIGNER_KEY}